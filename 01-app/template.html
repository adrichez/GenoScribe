<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>GenoScribe Form</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<main>
  <div style="height: 12px; background-color: transparent;"></div>

  <div class="informe-titulo">
    <h1>GenoScribe</h1>
    <h2>Generación de Informes Bioinformáticos Interactivos de forma Automatizada y Reproducible</h2>
    <p>Unidad de Bioinformática - IPBLN-CSIC - Granada</p>
  </div>

  <div class="container">
    {{contenido}}
    {{boton}}
    <div id="mensaje">{{mensaje}}</div>
    <div id="enlace">{{resultLinks}}</div>
    <div id="error">{{error}}</div>
  </div>
</main>

</body>
</html>
